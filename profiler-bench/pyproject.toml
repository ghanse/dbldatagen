[project]
name = "dbldatagen-profiler-bench"
dynamic = ["version"]
description = "Databricks Labs - benchmark harness for dbldatagen-profiler"
authors = [
    {name = "Databricks Labs", email = "labs-oss@databricks.com"},
]
readme = "README.md"
license = {text = "Databricks License"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "dbldatagen-profiler",
    "numpy>=1.21.5,<2.4",
    "pandas>=1.4.4,<3",
    "pyarrow>=8.0.0,<23.0.0",
    "pyspark[sql]>=3.4.1,<4.2",
    "scikit-learn>=1.4.2,<1.8",
]

[tool.uv.sources]
dbldatagen-profiler = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "black~=25.12.0",
    "mypy~=1.9.0",
    "ruff~=0.13.0",
]
test = [
    "pytest~=8.3.3",
]

[build-system]
requires = ["hatchling>=1.9.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/profiler_bench/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/profiler_bench"]

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID", "Q", "PL", "RUF", "ANN"]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "UP007",
    "ANN002",
    "ANN003",
]

[tool.ruff.lint.isort]
known-first-party = ["profiler_bench", "dbldatagen_profiler"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = ["slow: m-tier generation (excluded by default; run with -m slow)"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:unclosed <socket.socket:ResourceWarning",
    "ignore:Exception ignored in. <socket.socket:pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
